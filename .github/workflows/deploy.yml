name: Deploy Navika

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Reflex and dependencies
        run: |
          pip install reflex==0.8.28 reflex-hosting-cli
          pip install numpy==2.2.6 sqlalchemy==2.0.46 python-dotenv==1.1.1 httpx==0.28.1 pydantic==2.12.5 cryptography==44.0.2 python-multipart==0.0.20 aiohttp==3.12.15 google-generativeai==0.7.2

      - name: Login to Reflex Cloud
        run: |
          mkdir -p $HOME/.local/share/reflex
          echo '{"access_token":"${{ secrets.REFLEX_TOKEN }}"}' > $HOME/.local/share/reflex/hosting_v1.json

      - name: Deploy
        run: |
          reflex deploy \
            --env GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --env GMAIL_USER=${{ secrets.GMAIL_USER }} \
            --env "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" \
            --env GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --env GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --env APP_URL=https://navika-gold-star.reflex.run \
            --no-interactive
<!DOCTYPE html>
<html>
<head>
    <title>Hardcore RAG Finance AI</title>
    <style>
        body { background: #0f172a; color: white; font-family: Arial; padding: 40px; }
        button { padding: 10px 20px; margin: 10px 0; background: #7c3aed; color: white; border: none; }
        input { padding: 10px; width: 400px; }
        .box { background: #111827; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<h1>💳 Hardcore RAG Finance AI</h1>

<form action="/add" method="post">
    <button type="submit">Add Random Transaction</button>
</form>

<form action="/ask" method="post">
    <input name="question" placeholder="Ask about spending patterns..." required />
    <button type="submit">Run Deep RAG Analysis</button>
</form>

<div class="box">
    <h3>AI Response:</h3>
    <p>{{ answer }}</p>
</div>

<div class="box">
    <h3>Transactions:</h3>
    {% for tx in transactions %}
        <p>{{ tx.timestamp }} | {{ tx.merchant }} | {{ tx.category }} | ₹{{ tx.amount }}</p>
    {% endfor %}
</div>

</body>
</html>
